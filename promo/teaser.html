<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Kamosféra teaser</title>
<style>
  @font-face { font-family: 'Fredoka'; src: url(Fredoka-500.ttf); font-weight: 500; font-display: block; }
  @font-face { font-family: 'Fredoka'; src: url(Fredoka-600.ttf); font-weight: 600; font-display: block; }
  @font-face { font-family: 'Fredoka'; src: url(Fredoka-700.ttf); font-weight: 700; font-display: block; }
  :root {
    --blue: #3b82f6;
    --purple: #a53ce6;
    --pink: #eb5a9e;
    --navy: #0a1030;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
  body { font-family: 'Fredoka', sans-serif; color: #fff; position: relative; }
  #bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 900px at 20% 15%, rgba(59,130,246,.35), transparent 70%),
      radial-gradient(900px 900px at 85% 80%, rgba(165,60,230,.35), transparent 70%),
      radial-gradient(700px 700px at 50% 50%, rgba(235,90,158,.12), transparent 70%),
      var(--navy);
  }
  canvas { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
  .grad {
    background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* Scene 1 */
  #s1 .line { font-size: 118px; font-weight: 700; line-height: 1.1; text-align: center; }
  #s1 .small { font-size: 70px; font-weight: 500; color: #cbd5ff; margin-top: 40px; }

  /* Scene 2 */
  #s2 h2 { font-size: 92px; font-weight: 700; margin-bottom: 70px; text-align: center; line-height: 1.1; }
  .card {
    width: 820px; height: 190px; margin: 18px 0; border-radius: 48px;
    background: rgba(255,255,255,.08); border: 3px solid rgba(255,255,255,.16);
    display: flex; align-items: center; padding: 0 44px; gap: 44px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .card .ico {
    width: 130px; height: 130px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 72px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    box-shadow: 0 0 40px rgba(165,60,230,.6);
  }
  .card span { font-size: 76px; font-weight: 600; }

  /* Scene 3 */
  #s3 .shield { font-size: 330px; line-height: 1; }
  #s3 .big { font-size: 150px; font-weight: 700; margin-top: 50px; }
  #s3 .sub { font-size: 72px; font-weight: 500; color: #cbd5ff; margin-top: 24px; text-align: center; line-height: 1.2; }

  /* Scene 4 */
  #logoWrap { position: relative; width: 640px; height: 640px; }
  #ring {
    position: absolute; inset: -40px; border-radius: 50%;
    background: conic-gradient(from 0deg, #60a5fa, #c084fc, #f472b6, #60a5fa);
    filter: blur(8px);
  }
  #logo {
    position: absolute; inset: 0; border-radius: 50%;
    background: #0a1030 url(../public/logo.jpg) no-repeat;
    background-size: 820px auto; background-position: -90px -30px;
    border: 10px solid #0a1030;
  }
  #s4 .name { font-size: 175px; font-weight: 700; margin-top: 70px; line-height: 1; }
  #s4 .tag { font-size: 66px; font-weight: 500; color: #cbd5ff; margin-top: 28px; }
  #cta {
    margin-top: 80px; padding: 34px 90px; border-radius: 999px; font-size: 76px; font-weight: 700;
    background: linear-gradient(90deg, var(--blue), var(--purple), var(--pink));
    box-shadow: 0 0 60px rgba(235,90,158,.55);
  }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="stars" width="1080" height="1920"></canvas>

<div class="scene" id="s1">
  <div class="line" data-w="0">Tvoji kamoši</div>
  <div class="line grad" data-w="1">zo školy</div>
  <div class="small" data-w="2">konečne na jednom mieste</div>
</div>

<div class="scene" id="s2">
  <h2>Všetko, čo<br><span class="grad">máš rád</span></h2>
  <div class="card"><div class="ico">📸</div><span>Príbehy</span></div>
  <div class="card"><div class="ico">💬</div><span>Správy</span></div>
  <div class="card"><div class="ico">👥</div><span>Skupiny</span></div>
  <div class="card"><div class="ico">🎮</div><span>Hry</span></div>
  <div class="card"><div class="ico">🤖</div><span>AI kamarát</span></div>
</div>

<div class="scene" id="s3">
  <div class="shield">🛡️</div>
  <div class="big grad">Bezpečne.</div>
  <div class="sub">Len medzi kamarátmi.<br>Žiadni cudzí.</div>
</div>

<div class="scene" id="s4">
  <div id="logoWrap"><div id="ring"></div><div id="logo"></div></div>
  <div class="name grad">Kamosféra</div>
  <div class="tag">Detská sociálna sieť</div>
  <div id="cta">Pridaj sa! 🚀</div>
</div>

<div id="flash"></div>

<script>
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeIn = x => x * x * x;
  const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  // Seeded starfield
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stars = Array.from({ length: 260 }, () => ({
    a: rnd() * Math.PI * 2, d: rnd(), s: 0.6 + rnd() * 2.4, tw: rnd() * 6.28,
    hue: [210, 270, 330, 50][Math.floor(rnd() * 4)]
  }));
  const ctx = $('#stars').getContext('2d');

  function drawStars(t) {
    ctx.clearRect(0, 0, 1080, 1920);
    // warp speed peaks during intro and at the logo reveal
    const speed = 0.04 + 0.35 * Math.exp(-t * 1.3) + 0.25 * Math.exp(-Math.pow((t - 12) * 2.2, 2));
    for (const st of stars) {
      const d = (st.d + t * speed * 0.5 + t * 0.03) % 1;
      const r = 40 + Math.pow(d, 1.6) * 1300;
      const x = 540 + Math.cos(st.a) * r, y = 960 + Math.sin(st.a) * r;
      const tail = speed * 260 * d;
      const alpha = clamp(d * 2.5) * (0.6 + 0.4 * Math.sin(t * 3 + st.tw));
      ctx.strokeStyle = `hsla(${st.hue},90%,80%,${alpha})`;
      ctx.lineWidth = st.s * (0.5 + d);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - Math.cos(st.a) * tail, y - Math.sin(st.a) * tail);
      ctx.stroke();
    }
  }

  function scene(el, tin, tout) {
    // returns visibility 0..1 and sets opacity
    const v = Math.min(prog(window.__t, tin, tin + 0.3), 1 - prog(window.__t, tout - 0.3, tout));
    el.style.opacity = v;
    return v;
  }

  window.render = function (t) {
    window.__t = t;
    drawStars(t);

    // Scene 1: 0 - 3.3
    scene($('#s1'), 0, 3.3);
    $$('#s1 [data-w]').forEach((el, i) => {
      const p = easeOut(prog(t, 0.2 + i * 0.55, 0.8 + i * 0.55));
      const out = easeIn(prog(t, 2.9, 3.3));
      el.style.opacity = p;
      el.style.transform = `translateY(${(1 - p) * 80}px) scale(${1 + out * 0.6})`;
      el.style.filter = `blur(${(1 - p) * 12 + out * 14}px)`;
    });

    // Scene 2: 3.2 - 9.3
    scene($('#s2'), 3.2, 9.3);
    const h = easeOut(prog(t, 3.3, 3.8));
    $('#s2 h2').style.transform = `translateY(${(1 - h) * -60}px)`;
    $$('#s2 .card').forEach((el, i) => {
      const t0 = 3.9 + i * 0.75;
      const p = prog(t, t0, t0 + 0.55);
      const out = easeIn(prog(t, 8.8 + i * 0.05, 9.25 + i * 0.05));
      const dir = i % 2 ? 1 : -1;
      el.style.opacity = clamp(p * 3) * (1 - out);
      el.style.transform = `translateX(${(1 - easeOut(p)) * 700 * dir + out * 1200 * -dir}px) scale(${0.6 + 0.4 * back(p)})`;
      const pop = Math.exp(-Math.pow((t - t0 - 0.45) * 5, 2));
      el.querySelector('.ico').style.transform = `scale(${1 + pop * 0.3}) rotate(${pop * -12}deg)`;
    });

    // Scene 3: 9.2 - 12.1
    scene($('#s3'), 9.2, 12.1);
    const sh = prog(t, 9.3, 10.0);
    $('#s3 .shield').style.transform = `scale(${0.2 + 0.8 * back(sh)})`;
    $('#s3 .shield').style.filter = `drop-shadow(0 0 ${40 + 30 * Math.sin(t * 5)}px rgba(96,165,250,.9))`;
    const b = easeOut(prog(t, 9.8, 10.3));
    $('#s3 .big').style.transform = `translateY(${(1 - b) * 60}px)`;
    $('#s3 .big').style.opacity = b;
    const s = easeOut(prog(t, 10.3, 10.8));
    $('#s3 .sub').style.transform = `translateY(${(1 - s) * 60}px)`;
    $('#s3 .sub').style.opacity = s;

    // Flash transition into the logo
    $('#flash').style.opacity = 0.85 * Math.exp(-Math.pow((t - 12.05) * 7, 2));

    // Scene 4: 12.0 - end
    scene($('#s4'), 12.0, 99);
    const l = prog(t, 12.0, 12.8);
    $('#logoWrap').style.transform = `scale(${0.3 + 0.7 * back(l)}) rotate(${(1 - easeOut(l)) * -40}deg)`;
    $('#ring').style.transform = `rotate(${t * 120}deg)`;
    const n = easeOut(prog(t, 12.5, 13.0));
    $('#s4 .name').style.opacity = n;
    $('#s4 .name').style.transform = `translateY(${(1 - n) * 70}px) scale(${0.9 + 0.1 * n})`;
    const g = easeOut(prog(t, 12.9, 13.3));
    $('#s4 .tag').style.opacity = g;
    $('#s4 .tag').style.transform = `translateY(${(1 - g) * 40}px)`;
    const c = prog(t, 13.3, 13.8);
    $('#cta').style.opacity = clamp(c * 3);
    $('#cta').style.transform = `scale(${(0.5 + 0.5 * back(c)) * (1 + 0.04 * Math.sin((t - 13.8) * 8) * (t > 13.8 ? 1 : 0))})`;
  };

  // Live preview when opened in a browser (not while rendering frames)
  if (!location.search.includes('render')) {
    const start = performance.now();
    (function loop() {
      render(((performance.now() - start) / 1000) % 15);
      requestAnimationFrame(loop);
    })();
  }
</script>
</body>
</html>
