<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kamosféra — papírové promo</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bangers"; src: url(assets/fonts/Bangers.ttf); }
      @font-face { font-family: "Caveat"; src: url(assets/fonts/Caveat.ttf); font-weight: 700; }
      @font-face { font-family: "Archivo Black"; src: url(assets/fonts/Archivo.ttf); }
      @font-face { font-family: "Rubik"; src: url(assets/fonts/Rubik.ttf); font-weight: 900; }

      :root {
        --yellow: #ffd23f; --blue: #3b82f6; --pink: #ff5fa2; --mint: #3ddc97;
        --purple: #8b5cf6; --orange: #ff8c42; --navy: #22307a; --cream: #fff6e5;
        --ink: #1b1b2f; --red: #e11d48;
        /* paper grain: seeded SVG noise, multiplied over the paper colour */
        --grain: url(assets/img/grain.png);
        --sticker: drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(0 14px 10px rgba(0,0,0,.28));
        --lift: drop-shadow(0 12px 0 rgba(27,27,47,.18)) drop-shadow(0 18px 18px rgba(0,0,0,.22));
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffd23f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Rubik", sans-serif; font-weight: 900; color: var(--ink); }

      .scene { position: absolute; inset: 0; }
      .sheet { position: absolute; inset: -40px; background-image: var(--grain); background-blend-mode: multiply; }
      .paper { background-image: var(--grain); background-blend-mode: multiply; }
      .it { position: absolute; left: 0; top: 0; visibility: hidden; }
      .lift { filter: var(--lift); }
      .sticker { filter: var(--sticker); }

      /* ransom-note tiles */
      .ransom { position: absolute; left: 0; right: 0; display: flex; justify-content: center; flex-wrap: nowrap; gap: 8px; }
      .tile { position: relative; display: inline-block; line-height: 1; padding: 14px 16px 10px; visibility: hidden; filter: var(--lift); }

      .hand { font-family: "Caveat", cursive; font-weight: 700; white-space: nowrap; }
      .print { background: #fff; padding: 16px; border-radius: 30px; filter: var(--lift); }
      .print img { display: block; border-radius: 18px; }
      .tape { position: absolute; width: 190px; height: 58px; background: rgba(250,236,196,.86); }
      .dot { position: absolute; border-radius: 50%; }
      svg.draw path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .bubble { position: absolute; font-size: 72px; padding: 36px 46px 70px; white-space: nowrap; }
      .card { width: 380px; height: 660px; overflow: hidden; }
      .card img { width: 348px; height: 628px; object-fit: cover; object-position: top; }
      .postit { width: 470px; height: 330px; padding: 30px 34px; font-size: 80px; line-height: 1.0; white-space: normal; }
      #grainOverlay { position: absolute; inset: 0; pointer-events: none; background-image: var(--grain); opacity: .18; mix-blend-mode: multiply; }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 62%, rgba(40,20,0,.28) 100%); }
    </style>
  </head>
  <body>

    <script>
      (function () {
        const FPS = 12; // paper moves on twos-and-a-half: a 12 fps stop-motion cadence
        const DUR = 28;
        const rnd = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
        const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
        const easeOut = (x) => 1 - Math.pow(1 - x, 3);
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => Array.from(document.querySelectorAll(s));

        // ---- build ransom-note words (seeded colours, fonts, scissor cuts) ----
        const PAPERS = ["#ffffff", "#ffd23f", "#ff5fa2", "#3ddc97", "#3b82f6", "#8b5cf6", "#ff8c42", "#1b1b2f"];
        const FONTS = ["Bangers", "Archivo Black", "Rubik"];
        function scissorCut(seed) {
          const j = (k) => (rnd(seed * 7 + k) * 6).toFixed(1);
          return `polygon(${j(1)}% ${j(2)}%, ${50 + (rnd(seed + 3) - 0.5) * 20}% ${j(4)}%, ${100 - j(5)}% ${j(6)}%, ${100 - j(7)}% ${50 + (rnd(seed + 8) - 0.5) * 16}%, ${100 - j(9)}% ${100 - j(10)}%, ${50 + (rnd(seed + 11) - 0.5) * 20}% ${100 - j(12)}%, ${j(13)}% ${100 - j(14)}%, ${j(15)}% ${50 + (rnd(seed + 16) - 0.5) * 16}%)`;
        }
        let tileSeed = 1;
        $$(".ransom").forEach((row) => {
          const size = +row.dataset.size;
          [...row.dataset.text].forEach((ch, i) => {
            const s = tileSeed++;
            const bg = PAPERS[Math.floor(rnd(s * 3.1) * PAPERS.length)];
            const dark = bg === "#1b1b2f" || bg === "#8b5cf6" || bg === "#3b82f6";
            const tile = document.createElement("span");
            tile.className = "tile paper";
            tile.textContent = ch;
            tile.style.cssText = `font-family: "${FONTS[Math.floor(rnd(s * 5.7) * 3)]}"; font-size: ${size * (0.86 + rnd(s * 2.3) * 0.28)}px; background-color: ${bg}; color: ${dark ? "#fff" : "#1b1b2f"}; clip-path: ${scissorCut(s)}; margin-top: ${(rnd(s * 9.1) - 0.5) * 30}px`;
            tile.dataset.t = (+row.dataset.t + i / FPS).toFixed(3);
            tile.dataset.r = ((rnd(s * 4.4) - 0.5) * 16).toFixed(1);
            tile.dataset.seed = s;
            row.appendChild(tile);
          });
        });

        // logo crops (the circle part of public/logo.jpg, never redrawn)
        $$(".logo").forEach((el) => {
          const d = el.parentElement.clientWidth;
          el.style.background = `#070b24 url(assets/img/logo.jpg) no-repeat`;
          el.style.backgroundSize = `${724 * d / 560}px auto`;
          el.style.backgroundPosition = `${-82 * d / 560}px ${-28 * d / 560}px`;
        });

        // torn leading edge for the scene sheets
        function tornEdge(dir, seed) {
          const pts = [];
          const n = 26;
          for (let i = 0; i <= n; i++) {
            const a = (i / n) * 100, b = rnd(seed * 13 + i) * 2.4 + (i % 2) * 1.2;
            pts.push(dir === "left" ? `${100 - b}% ${a}%` : dir === "right" ? `${b}% ${a}%` : dir === "top" ? `${a}% ${100 - b}%` : `${a}% ${b}%`);
          }
          if (dir === "left") return `polygon(0 0, ${pts.join(",")}, 0 100%)`;
          if (dir === "right") return `polygon(${pts.join(",")}, 100% 100%, 100% 0)`;
          if (dir === "top") return `polygon(0 0, 100% 0, ${pts.reverse().join(",")})`;
          return `polygon(${pts.join(",")}, 100% 100%, 0 100%)`;
        }
        const SHEETS = [
          ["#s3sheet", 7.55, "left"], ["#s4sheet", 10.6, "top"], ["#s5sheet", 12.6, "right"],
          ["#s6sheet", 14.3, "bottom"], ["#s7sheet", 16.4, "left"], ["#s8sheet", 21.5, "bottom"],
        ];
        SHEETS.forEach(([id, , dir], i) => ($(id).style.clipPath = tornEdge(dir, i + 2)));

        // confetti: cut-paper shapes
        const SHAPES = ["50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%", "50% 0, 100% 100%, 0 100%", "0 0, 100% 0, 100% 100%, 0 100%"];
        const confetti = [];
        for (let i = 0; i < 46; i++) {
          const el = document.createElement("div");
          const sz = 34 + rnd(i * 3.3) * 46;
          el.className = "paper";
          el.style.cssText = `position:absolute; left:0; top:0; width:${sz}px; height:${sz}px; background-color:${PAPERS[i % 7]}; clip-path:${rnd(i * 8.8) < 0.3 ? "circle(50%)" : `polygon(${SHAPES[i % 3]})`}; filter: drop-shadow(0 6px 0 rgba(0,0,0,.18)); visibility:hidden`;
          $("#confetti").appendChild(el);
          const a = -Math.PI / 2 + (rnd(i * 5.1) - 0.5) * 2.6, v = 900 + rnd(i * 6.2) * 1400;
          confetti.push({ el, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rs: (rnd(i * 7.3) - 0.5) * 900 });
        }

        // path lengths for draw-on strokes
        $$("svg.draw path").forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });

        // ---- stop-motion primitives: everything reads the quantized time ----
        function boil(seed, ts, amp = 1) {
          const k = Math.floor(ts * FPS / 2); // new pose every 2 steps
          return { x: (rnd(seed * 31 + k) - 0.5) * 5 * amp, y: (rnd(seed * 57 + k) - 0.5) * 5 * amp, r: (rnd(seed * 91 + k) - 0.5) * 1.8 * amp };
        }
        const SQUASH = [1.22, 0.9, 1.06, 0.97, 1];
        // a scene's pieces leave with their scene (child visibility would otherwise outlive the clip)
        const sceneEnd = (el) => { const sc = el.closest(".scene"); return +sc.dataset.start + +sc.dataset.duration; };
        function pop(el, ts, seed) {
          const t0 = +el.dataset.t;
          if (ts < t0 || ts >= el._end) { el.style.visibility = "hidden"; return; }
          el.style.visibility = "visible";
          const d = Math.round((ts - t0) * FPS);
          const n = +(el.dataset.throw || (el.dataset.dx || el.dataset.dy ? 3 : 0));
          const dx = +(el.dataset.dx || 0), dy = +(el.dataset.dy || 0), r0 = +(el.dataset.r || 0);
          let x = 0, y = 0, s = 1, r = r0;
          if (d < n) { const u = easeOut((d + 1) / (n + 1)); x = dx * (1 - u); y = dy * (1 - u); r = r0 + (1 - u) * 18 * Math.sign(dx || dy || 1); }
          else { s = SQUASH[Math.min(d - n, SQUASH.length - 1)]; }
          const b = boil(seed, ts);
          el.style.transform = `translate(${x + b.x}px, ${y + b.y}px) rotate(${r + b.r}deg) scale(${s})`;
        }
        function writeOn(el, ts) {
          const t0 = +el.dataset.t, n = +el.dataset.write;
          if (ts < t0 || ts >= el._end) { el.style.visibility = "hidden"; return; }
          el.style.visibility = "visible";
          const d = Math.round((ts - t0) * FPS) + 1;
          el.style.clipPath = `inset(-20% ${Math.max(0, 100 - (d / n) * 100)}% -20% -5%)`;
          const b = boil(+el.dataset.seed || 7, ts, 0.6);
          el.style.transform = `translate(${b.x}px, ${b.y}px) rotate(${-3 + b.r}deg)`;
        }
        function draw(path, ts, t0, steps) {
          const L = +path.dataset.len;
          const d = Math.round((ts - t0) * FPS) + 1;
          path.style.strokeDashoffset = ts < t0 ? L : L * (1 - clamp(d / steps));
        }
        function sheetIn(id, ts, t0, dir) {
          const el = $(id), steps = 4;
          const d = Math.round((ts - t0) * FPS);
          const u = easeOut(clamp((d + 1) / steps));
          const off = { left: [-1200, 0], right: [1200, 0], top: [0, -2000], bottom: [0, 2000] }[dir];
          el.style.transform = `translate(${off[0] * (1 - u)}px, ${off[1] * (1 - u)}px) rotate(${(1 - u) * (dir === "left" || dir === "bottom" ? -4 : 4)}deg)`;
        }

        const pops = $$(".it:not(.hand):not(svg), .tile");
        pops.forEach((el, i) => { el.dataset.seed = el.dataset.seed || i + 100; el._end = sceneEnd(el); });
        const hands = $$(".hand.it");
        hands.forEach((el, i) => { el.dataset.seed = i + 300; el._end = sceneEnd(el); });

        function applyTime(t) {
          const ts = Math.floor(t * FPS + 1e-6) / FPS;

          pops.forEach((el) => pop(el, ts, +el.dataset.seed));
          hands.forEach((el) => writeOn(el, ts));
          SHEETS.forEach(([id, t0, dir]) => sheetIn(id, ts, t0, dir));

          // S1: stickers are sucked into the planet, the planet grows into the blue sheet (shape match)
          const suck = clamp((Math.round((ts - 4.2) * FPS) + 1) / 6);
          if (ts >= 4.2) {
            [["#avatars", 540 - 305, 960 - 910], ["#polaroid1", 540 - 800, 960 - 900], ["#gameSticker", 540 - 540, 960 - 1490]].forEach(([id, tx, ty], k) => {
              const el = $(id), u = easeOut(clamp(suck - k * 0.12));
              el.style.transform += ` translate(${tx * u}px, ${ty * u}px) scale(${1 - u * 0.95}) rotate(${u * 200}deg)`;
              if (u >= 0.99) el.style.visibility = "hidden";
            });
            ["#lblFriends", "#lblPhotos", "#lblGames", "#hele"].forEach((id) => ($(id).style.opacity = 0));
          }
          if (ts >= 3.95) $("#planet").style.transform += ` rotate(${Math.round((ts - 3.95) * FPS) * 6}deg)`;
          const grow = Math.round((ts - 5.2) * FPS);
          $("#s2sheet").style.clipPath = `circle(${ts < 5.2 ? 0 : [300, 520, 900, 1500][Math.min(grow, 3)]}px at 540px 1000px)`;

          // S4: camera flash + the polaroid develops
          const f = Math.round((ts - 11.3) * FPS);
          $("#flash").style.opacity = ts < 11.3 ? 0 : [0.95, 0.6, 0.25, 0][Math.min(f, 3)];
          $("#develop").style.opacity = ts < 11.3 ? 1 : Math.max(0, 1 - (f + 1) / 6);
          $("#storyImg").style.filter = `sepia(${Math.max(0, 1 - (f + 1) / 8)})`;

          // S6: the three game cards fan open
          const fan = clamp((Math.round((ts - 15.15) * FPS) + 1) / 4);
          [["#card1", -16, -250], ["#card2", 16, 250], ["#card3", 0, 0]].forEach(([id, rot, dx]) => {
            if (ts >= 15.15) $(id).style.transform += ` translate(${dx * easeOut(fan)}px, ${Math.abs(dx) * 0.12 * fan}px) rotate(${rot * easeOut(fan)}deg)`;
          });
          $$(".card").forEach((c) => (c.style.transformOrigin = "50% 110%"));

          // S7 / S8 strokes
          draw($("#check path"), ts, 18.9, 4);
          $$("#xmark path").forEach((p, i) => draw(p, ts, 20.25 + i * 0.25, 3));
          const ul = $("#underline");
          ul.style.visibility = ts >= 23.4 && ts < 28 ? "visible" : "hidden";
          draw($("#underline path"), ts, 23.4, 5);

          // S8 confetti: stepped ballistic paper bits
          const dt = ts - 24.15;
          confetti.forEach((c, i) => {
            if (dt < 0 || dt > 3.6) { c.el.style.visibility = "hidden"; return; }
            c.el.style.visibility = "visible";
            const x = 540 + c.vx * dt * 0.55, y = 1490 + c.vy * dt * 0.55 + 900 * dt * dt;
            c.el.style.transform = `translate(${x}px, ${y}px) rotate(${c.rs * dt}deg)`;
          });

          // CTA keeps breathing on the beat after it lands
          if (ts >= 24.6) $("#cta").style.transform += ` scale(${1 + (Math.round(ts * 2) % 2) * 0.04})`;

          // grain boils every 2 steps, like re-shot paper
          const g = Math.floor(ts * FPS / 2);
          $("#grainOverlay").style.backgroundPosition = `${Math.floor(rnd(g) * 300)}px ${Math.floor(rnd(g + 9) * 300)}px`;
        }

        const tl = gsap.timeline({ paused: true, onUpdate: () => applyTime(tl.time()) });
        tl.to({ p: 0 }, { p: 1, duration: DUR, ease: "none" }, 0); // inert anchor: onUpdate fires on every seek
        applyTime(0);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
