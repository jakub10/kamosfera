<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Kamosféra 30s</title>
<style>
  @font-face { font-family: 'Fredoka'; src: url(Fredoka-500.ttf); font-weight: 500; font-display: block; }
  @font-face { font-family: 'Fredoka'; src: url(Fredoka-600.ttf); font-weight: 600; font-display: block; }
  @font-face { font-family: 'Fredoka'; src: url(Fredoka-700.ttf); font-weight: 700; font-display: block; }
  :root { --blue: #3b82f6; --purple: #a53ce6; --pink: #eb5a9e; --navy: #070b24; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
  body { font-family: 'Fredoka', sans-serif; color: #fff; position: relative; }
  .abs { position: absolute; }
  .fill { position: absolute; inset: 0; }
  .grad { background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grad-gold { background: linear-gradient(90deg, #fde68a, #fbbf24, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; }

  #bg { background: radial-gradient(1200px 1000px at 50% 40%, #16205a 0%, var(--navy) 70%); }
  .leak { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; filter: blur(140px); mix-blend-mode: screen; }
  #leak1 { background: rgba(59,130,246,.55); }
  #leak2 { background: rgba(165,60,230,.5); }
  #leak3 { background: rgba(235,90,158,.35); }

  #world { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 50%; }

  /* ---------- Hook ---------- */
  #hook { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #hook .row { display: flex; gap: 30px; }
  #hook .hw { font-size: 132px; font-weight: 700; line-height: 1.05; letter-spacing: -2px; }

  /* ---------- Hero ---------- */
  #hero { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  #hero img { position: absolute; width: 820px; left: -410px; top: -330px; }
  #halo { position: absolute; width: 900px; height: 900px; left: -450px; top: -350px; border-radius: 50%;
    background: radial-gradient(circle, rgba(96,165,250,.55), rgba(165,60,230,.25) 45%, transparent 70%); }
  #ring3d { position: absolute; width: 1100px; height: 1100px; left: -550px; top: -470px; border-radius: 50%;
    border: 10px solid transparent;
    background: linear-gradient(#0000,#0000) padding-box, conic-gradient(#60a5fa, #c084fc, #f472b6, #fbbf24, #60a5fa) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0);
    box-shadow: 0 0 60px rgba(192,132,252,.6); }
  .planet { position: absolute; border-radius: 50%; }

  /* ---------- Phone ---------- */
  .rig { position: absolute; left: 50%; top: 50%; width: 418px; height: 872px; margin: -436px 0 0 -209px; transform-style: preserve-3d; }
  .phone { position: absolute; inset: 0; border-radius: 62px; background: linear-gradient(145deg, #2a2f45, #0c0f1d 60%, #1c2033);
    padding: 14px; box-shadow: 0 0 0 2px #454b66 inset, 0 60px 120px rgba(0,0,0,.6), 0 0 80px rgba(96,165,250,.25); }
  .screen { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #f9fafb; }
  .screen > * { position: absolute; left: 0; top: 0; width: 390px; }
  .notch { position: absolute; left: 50%; top: 24px; width: 110px; height: 30px; margin-left: -55px; border-radius: 20px; background: #05060c; }
  .glare { position: absolute; inset: 14px; border-radius: 48px; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 42%, transparent 55%); background-size: 300% 100%; mix-blend-mode: screen; }
  .strip { height: 57px; background: url(shots/feed.png) 0 0 / 390px auto no-repeat; }
  .navstrip { top: auto !important; bottom: 0; height: 65px; background: url(shots/feed.png) 0 100% / 390px auto no-repeat; }
  .chatmask { background: rgb(249,250,251); }

  .chip { position: absolute; padding: 18px 30px; border-radius: 999px; font-size: 44px; font-weight: 700; white-space: nowrap;
    background: rgba(255,255,255,.92); color: #1e1b4b; box-shadow: 0 20px 50px rgba(0,0,0,.35), 0 0 0 3px rgba(192,132,252,.6); }
  .emo { position: absolute; font-size: 120px; line-height: 1; filter: drop-shadow(0 20px 30px rgba(0,0,0,.4)); }

  /* ---------- Carousel ---------- */
  #carousel { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  #carousel .rig { left: 0; top: 0; }

  /* ---------- Safety ---------- */
  #safe { display: flex; flex-direction: column; align-items: center; }
  #safeMascot { position: absolute; width: 640px; left: 220px; top: 520px; }
  .pulse { position: absolute; left: 540px; top: 840px; width: 0; height: 0; }
  .pulse div { position: absolute; border-radius: 50%; border: 6px solid rgba(96,165,250,.8); }
  .glass { position: absolute; left: 140px; width: 800px; height: 150px; border-radius: 40px; display: flex; align-items: center; gap: 30px;
    padding: 0 44px; font-size: 58px; font-weight: 600; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.25);
    backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .glass b { font-size: 74px; }

  /* ---------- End ---------- */
  #end { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #rays { position: absolute; left: 50%; top: 42%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(192,132,252,.22) 0deg 7deg, transparent 7deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 0%, transparent 60%); mask: radial-gradient(circle, #000 0%, transparent 60%); }
  #logoWrap { position: relative; width: 620px; height: 620px; margin-top: -40px; }
  #logoRing { position: absolute; inset: -34px; border-radius: 50%; background: conic-gradient(#60a5fa, #c084fc, #f472b6, #fbbf24, #60a5fa); filter: blur(6px); }
  #logo { position: absolute; inset: 0; border-radius: 50%; border: 10px solid var(--navy);
    background: var(--navy) url(../public/logo.jpg) no-repeat; background-size: 800px auto; background-position: -90px -30px; }
  #endName { font-size: 180px; font-weight: 700; margin-top: 60px; line-height: 1; display: flex; }
  #endName span { display: inline-block; }
  #endTag { font-size: 64px; font-weight: 500; color: #d6dcff; margin-top: 26px; }
  #cta { margin-top: 70px; padding: 34px 96px; border-radius: 999px; font-size: 80px; font-weight: 700;
    background: linear-gradient(90deg, var(--blue), var(--purple), var(--pink)); box-shadow: 0 0 80px rgba(235,90,158,.6); }

  /* ---------- Captions ---------- */
  .cap { position: absolute; left: 0; right: 0; top: 130px; text-align: center; }
  .cap .k { font-size: 38px; font-weight: 600; letter-spacing: .32em; color: #93c5fd; margin-bottom: 14px; }
  .cap .t { font-size: 104px; font-weight: 700; line-height: 1.05; }
  .w { display: inline-block; }

  canvas { position: absolute; inset: 0; }
  #grain { width: 1080px; height: 1920px; mix-blend-mode: overlay; opacity: .16; }
  #vignette { background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  #flash { background: #fff; opacity: 0; mix-blend-mode: screen; }
</style>
</head>
<body>
<div id="bg" class="fill"></div>
<div id="leak1" class="leak"></div><div id="leak2" class="leak"></div><div id="leak3" class="leak"></div>
<canvas id="stars" width="1080" height="1920"></canvas>

<div id="world">
  <!-- Hook -->
  <div id="hook" class="fill">
    <div class="row"><span class="hw" data-t="0">TVOJI</span><span class="hw grad" data-t="0.5">KAMOŠI.</span></div>
    <div class="row"><span class="hw" data-t="1.5">TVOJ</span><span class="hw grad" data-t="2.0">SVET.</span></div>
  </div>

  <!-- Hero mascot -->
  <div id="hero">
    <div id="halo"></div>
    <div id="ring3d"></div>
    <div class="planet" id="pl1" style="width:90px;height:90px;background:radial-gradient(circle at 30% 30%,#fde68a,#f97316);"></div>
    <div class="planet" id="pl2" style="width:60px;height:60px;background:radial-gradient(circle at 30% 30%,#a7f3d0,#10b981);"></div>
    <div class="planet" id="pl3" style="width:70px;height:70px;background:radial-gradient(circle at 30% 30%,#f5d0fe,#a855f7);"></div>
    <img id="heroImg" src="../src/assets/mascot-welcome.png">
  </div>

  <!-- Main phone -->
  <div class="rig" id="rig">
    <div class="phone">
      <div class="screen" id="scr">
        <div id="Lfeed"><img id="feedImg" src="shots/feed-full.png" style="width:390px"><div class="strip abs" style="top:0;width:390px"></div></div>
        <div class="navstrip" id="feedNav"></div>
        <img id="Lstory" src="shots/story.png">
        <div id="storyPop" style="top:227px;height:390px;background:#000"></div>
        <div id="Lchat" style="height:844px"><img src="shots/messages.png" style="width:390px"><div class="chatmask abs" id="chatMask" style="left:0;width:390px"></div></div>
      </div>
      <div class="notch"></div>
      <div class="glare" id="glare"></div>
    </div>
    <div class="chip" id="c1">😂 12</div>
    <div class="chip" id="c2">🔥 Rekord!</div>
    <div class="chip" id="c3">💜 24</div>
    <div class="chip" id="c4">🏆 4.B víťazí</div>
    <div class="emo" id="e1">🍦</div>
    <div class="emo" id="e2">🙌</div>
    <div class="emo" id="e3">😊</div>

  </div>

  <!-- Games carousel -->
  <div id="carousel">
    <div class="rig" data-i="0"><div class="phone"><div class="screen"><img src="shots/games.png"></div><div class="notch"></div><div class="glare"></div></div></div>
    <div class="rig" data-i="1"><div class="phone"><div class="screen"><img src="shots/hliadka.png"></div><div class="notch"></div><div class="glare"></div></div></div>
    <div class="rig" data-i="2"><div class="phone"><div class="screen"><img src="shots/pevnost.png"></div><div class="notch"></div><div class="glare"></div></div></div>
  </div>
</div>

<img id="peekThumb" class="abs" src="../src/assets/mascot-thumbsup.png" style="width:470px">
<img id="peekChat" class="abs" src="../src/assets/mascot-chat.png" style="width:440px">
<img id="peekGame" class="abs" src="../src/assets/mascot-gaming.png" style="width:470px">

<!-- Safety -->
<div id="safe" class="fill">
  <div class="pulse" id="pulse"><div></div><div></div><div></div></div>
  <img id="safeMascot" src="../src/assets/kamosfera-mascot.png">
  <div class="glass" id="g1" style="top:1300px"><b>🔒</b>Len kamoši zo školy</div>
  <div class="glass" id="g2" style="top:1480px"><b>🙅</b>Žiadni cudzí</div>
  <div class="glass" id="g3" style="top:1660px"><b>🛡️</b>Bezpečné pre deti</div>
</div>

<!-- End card -->
<div id="end" class="fill">
  <div id="rays"></div>
  <div id="logoWrap"><div id="logoRing"></div><div id="logo"></div></div>
  <div id="endName" class="grad"></div>
  <div id="endTag">Detská sociálna sieť</div>

</div>

<!-- Captions -->
<div class="cap" id="capHero" style="top:1480px"><div class="k">VITAJ V</div><div class="t grad split">Kamosfére</div></div>
<div class="cap" id="capFeed"><div class="k">PRÍSPEVKY</div><div class="t split">Zdieľaj, čo <span class="grad">ťa baví</span></div></div>
<div class="cap" id="capStory"><div class="k">STORIES</div><div class="t split">Zachyť <span class="grad">moment</span> 📸</div></div>
<div class="cap" id="capChat"><div class="k">SPRÁVY</div><div class="t split">Píš si <span class="grad">s kamošmi</span></div></div>
<div class="cap" id="capGames"><div class="k">HRY</div><div class="t split">Hraj <span class="grad">s partiou</span> 🎮</div></div>
<div class="cap" id="capSafe" style="top:190px"><div class="k">A HLAVNE</div><div class="t split" style="font-size:150px"><span class="grad">Bezpečne.</span></div></div>

<canvas id="fx" width="1080" height="1920"></canvas>
<div id="vignette" class="fill"></div>
<canvas id="grain" width="360" height="640"></canvas>
<div id="flash" class="fill"></div>

<script>
  // ---------- helpers ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const eOut = x => 1 - Math.pow(1 - x, 3);
  const eIn = x => x * x * x;
  const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const back = (x, c = 1.7) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
  const lerp = (a, b, x) => a + (b - a) * x;
  const bump = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const vis = (t, a, b, fi = .25, fo = .25) => Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));
  function css(el, o) { for (const k in o) el.style[k] = o[k]; }
  function show(el, v) { el.style.opacity = v; el.style.visibility = v > 0.001 ? 'visible' : 'hidden'; }
  const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;

  // Split caption titles into words (keeps the gradient spans intact).
  $$('.split').forEach(el => {
    const walk = node => [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(p => {
          if (!p) return;
          if (/^\s+$/.test(p)) frag.append(p);
          else { const s = document.createElement('span'); s.className = 'w' + (node.classList?.contains('grad') ? ' grad' : ''); s.textContent = p; frag.append(s); }
        });
        n.replaceWith(frag);
      } else walk(n);
    });
    walk(el);
    el.querySelectorAll('.grad').forEach(g => { if (!g.classList.contains('w')) g.classList.remove('grad'); });
  });
  'Kamosféra'.split('').forEach(ch => { const s = document.createElement('span'); s.textContent = ch; s.className = 'grad'; $('#endName').append(s); });
  $('#endName').classList.remove('grad');

  function caption(el, t, a, b) {
    const v = vis(t, a, b, 0.01, 0.3);
    show(el, v);
    if (v <= 0) return;
    const out = prog(t, b - 0.3, b);
    el.style.transform = `translateY(${-out * 60}px)`;
    el.style.filter = `blur(${out * 16}px)`;
    const k = eOut(prog(t, a, a + 0.4));
    el.querySelector('.k').style.cssText = `opacity:${k};letter-spacing:${lerp(.8, .32, k)}em`;
    el.querySelectorAll('.w').forEach((w, i) => {
      const p = prog(t, a + 0.08 + i * 0.07, a + 0.55 + i * 0.07);
      w.style.transform = `translateY(${(1 - back(p)) * 90}px) rotate(${(1 - eOut(p)) * 10}deg)`;
      w.style.opacity = clamp(p * 2.5);
    });
  }

  // ---------- starfield ----------
  const sr = rng(11);
  const stars = Array.from({ length: 320 }, () => ({ a: sr() * 6.283, d: sr(), s: .6 + sr() * 2.6, tw: sr() * 6.28, hue: [210, 270, 320, 45][Math.floor(sr() * 4)] }));
  const sctx = $('#stars').getContext('2d');
  let starPos = 0;
  function speedAt(t) {
    return 0.05 + 0.5 * bump(t, 3.8, 0.45) + 0.15 * bump(t, 0.3, 0.6) + 0.2 * bump(t, 12, .25) + 0.2 * bump(t, 20, .25)
      + 0.7 * bump(t, 26.9, 0.35) + 0.12 * bump(t, 27.3, 0.5);
  }
  function drawStars(t) {
    // integrate speed so warp is continuous
    starPos = 0; for (let x = 0; x < t; x += 1 / 60) starPos += speedAt(x) / 60;
    const sp = speedAt(t);
    sctx.clearRect(0, 0, 1080, 1920);
    sctx.lineCap = 'round';
    for (const st of stars) {
      const d = (st.d + starPos * 0.9 + t * 0.012) % 1;
      const r = 30 + Math.pow(d, 1.7) * 1400;
      const x = 540 + Math.cos(st.a) * r, y = 960 + Math.sin(st.a) * r;
      const tail = sp * 520 * d;
      const al = clamp(d * 2.5) * (0.55 + 0.45 * Math.sin(t * 3 + st.tw));
      sctx.strokeStyle = `hsla(${st.hue},90%,82%,${al})`;
      sctx.lineWidth = st.s * (0.5 + d);
      sctx.beginPath(); sctx.moveTo(x, y); sctx.lineTo(x - Math.cos(st.a) * tail, y - Math.sin(st.a) * tail); sctx.stroke();
    }
  }

  // ---------- particles (confetti / sparks) ----------
  const fctx = $('#fx').getContext('2d');
  const COLORS = ['#60a5fa', '#c084fc', '#f472b6', '#fbbf24', '#34d399', '#ffffff'];
  function burst(seed, n, x0, y0, power) {
    const r = rng(seed);
    return Array.from({ length: n }, () => {
      const a = r() * 6.283, v = power * (0.35 + r() * 0.65);
      return { x0, y0, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.35, c: COLORS[Math.floor(r() * 6)], w: 10 + r() * 16, h: 6 + r() * 10, rs: (r() - .5) * 20, ph: r() * 6 };
    });
  }
  const bursts = [
    { t0: 13.55, parts: burst(5, 140, 540, 1000, 1500) },
    { t0: 27.0, parts: burst(9, 220, 540, 830, 2100) },
  ];
  function drawFx(t) {
    fctx.clearRect(0, 0, 1080, 1920);
    for (const b of bursts) {
      const dt = t - b.t0;
      if (dt < 0 || dt > 3) continue;
      for (const p of b.parts) {
        const drag = (1 - Math.exp(-dt * 2.2)) / 2.2;
        const x = p.x0 + p.vx * drag + Math.sin(dt * 4 + p.ph) * 20;
        const y = p.y0 + p.vy * drag + 700 * dt * dt * 0.5;
        fctx.save(); fctx.translate(x, y); fctx.rotate(p.rs * dt + p.ph);
        fctx.scale(1, Math.cos(dt * 9 + p.ph));
        fctx.globalAlpha = clamp(1.4 - dt / 2.2);
        fctx.fillStyle = p.c; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        fctx.restore();
      }
    }
  }

  // ---------- film grain ----------
  const gctx = $('#grain').getContext('2d');
  const gimg = gctx.createImageData(360, 640);
  function drawGrain(frame) {
    let s = (frame * 7919 + 1) % 2147483647;
    const d = gimg.data;
    for (let i = 0; i < d.length; i += 4) {
      s = (s * 16807) % 2147483647;
      const v = (s & 255);
      d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
    }
    gctx.putImageData(gimg, 0, 0);
  }

  // ---------- phone rig ----------
  function rigTransform(o) {
    return `translate3d(${o.x || 0}px,${o.y || 0}px,${o.z || 0}px) rotateX(${o.rx || 0}deg) rotateY(${o.ry || 0}deg) rotateZ(${o.rz || 0}deg) scale(${o.s || 1})`;
  }
  function chip(el, t, a, b, x, y, z, bob = 1) {
    const v = vis(t, a, b, .01, .25);
    show(el, v);
    if (v <= 0) return;
    const p = prog(t, a, a + 0.45);
    const zz = lerp(0, z, back(p, 2.2));
    el.style.transform = `translate3d(${x}px,${y + Math.sin(t * 2.4 + x) * 12 * bob}px,${zz}px) scale(${lerp(.3, 1, back(p, 2.2))})`;
  }

  // ---------- main render ----------
  window.render = function (t, frame = Math.round(t * 30)) {
    // background light leaks drift
    css($('#leak1'), { transform: `translate(${-300 + Math.sin(t * .35) * 250}px, ${-200 + Math.cos(t * .27) * 300}px)` });
    css($('#leak2'), { transform: `translate(${400 + Math.cos(t * .3) * 250}px, ${1100 + Math.sin(t * .4) * 250}px)` });
    css($('#leak3'), { transform: `translate(${Math.sin(t * .22 + 1) * 400}px, ${500 + Math.cos(t * .33) * 400}px)`, opacity: .6 + .4 * Math.sin(t) });
    drawStars(t);

    // beat pulse on the groove (kick every 0.5s from 4s to 24s)
    const inGroove = t >= 4 && t < 24;
    const pulse = inGroove ? Math.exp(-((t - 4) % 0.5) * 12) : 0;
    $('#world').style.transform = `scale(${1 + pulse * 0.012})`;

    // ===== A. Hook 0–4 =====
    const hookV = 1 - prog(t, 3.75, 4.0);
    show($('#hook'), hookV);
    if (hookV > 0) {
      const fly = eIn(prog(t, 2.6, 4.0));
      $('#hook').style.transform = `scale(${1 + fly * 5}) translateY(${fly * -60}px)`;
      $('#hook').style.filter = `blur(${fly * 18}px)`;
      $$('#hook .hw').forEach(el => {
        const t0 = +el.dataset.t;
        const p = prog(t, t0, t0 + 0.22);
        const hit = Math.exp(-Math.max(t - t0, 0) * 7) * (t >= t0 ? 1 : 0);
        const split = 18 * hit;
        el.style.opacity = t >= t0 ? 1 : 0;
        el.style.transform = `scale(${lerp(1.9, 1, eOut(p))}) translate(${Math.sin(t * 90) * 8 * hit}px, ${Math.cos(t * 70) * 6 * hit}px)`;
        el.style.textShadow = `${-split}px 0 rgba(255,40,120,.85), ${split}px 0 rgba(40,220,255,.85)`;
      });
    }

    // ===== B. Hero 4–6 =====
    const heroV = vis(t, 3.9, 6.1, .1, .3);
    show($('#hero'), heroV);
    if (heroV > 0) {
      const inp = eOut(prog(t, 3.9, 4.7));
      const whip = eIn(prog(t, 5.65, 6.1));
      $('#hero').style.transform = `translate3d(${-whip * 1400}px, ${-80 + Math.sin(t * 2) * 12}px, ${lerp(-2200, 0, inp)}px) rotateY(${lerp(50, 0, inp) + whip * -30}deg)`;
      $('#heroImg').style.filter = `blur(${whip * 20}px) drop-shadow(0 30px 60px rgba(0,0,0,.5))`;
      $('#heroImg').style.transform = `rotate(${Math.sin(t * 5) * 3}deg)`;
      $('#halo').style.transform = `scale(${1 + 0.08 * Math.sin(t * 6)})`;
      $('#ring3d').style.transform = `rotateX(74deg) rotateZ(${t * 70}deg) scale(${lerp(.4, 1, inp)})`;
      [['#pl1', 0, 520], ['#pl2', 2.1, 470], ['#pl3', 4.2, 560]].forEach(([id, ph, r]) => {
        const a = t * 1.6 + ph;
        const z = Math.sin(a) * r * 0.4;
        $(id).style.transform = `translate3d(${Math.cos(a) * r - 40}px, ${80 + Math.sin(a) * r * 0.27}px, ${z}px) scale(${lerp(0, 1, inp)})`;
        $(id).style.zIndex = z > 0 ? 5 : 0;
      });
    }
    caption($('#capHero'), t, 4.3, 5.8);

    // ===== C–E. Main phone 6–20 =====
    const rigV = vis(t, 5.8, 20.4, .2, .35);
    show($('#rig'), rigV);
    if (rigV > 0) {
      // base pose: swing in, drift, stories push-in, flip, chat, pull back
      const swing = eOut(prog(t, 5.8, 6.7));
      let o = { x: lerp(900, 0, swing), y: 200, z: 0, ry: lerp(-70, -16, swing) + prog(t, 6.7, 11.2) * 30 - eIO(prog(t, 11.2, 11.7)) * 14, rx: 6, rz: lerp(8, 0, swing), s: 1.6 };
      // zoom-through into the story ring (screen point 145,108)
      const zi = eIn(prog(t, 11.7, 12.15)), zo = eOut(prog(t, 12.15, 12.8));
      if (t > 11.7 && t < 12.8) {
        const k = t < 12.15 ? zi : 1 - zo;
        o.ry = lerp(o.ry, 0, t < 12.15 ? zi : 1); o.rx = lerp(6, 0, k);
        o.s = 1.6 * (1 + k * 5);
        o.x = 50 * o.s * k; o.y = lerp(200, 314 * o.s, k);
      }
      if (t >= 12.8) o.ry = -10 + prog(t, 12.8, 15.6) * 20;
      // flip to chat
      const f1 = eIn(prog(t, 15.55, 15.85)), f2 = eOut(prog(t, 15.85, 16.3));
      if (t >= 15.55 && t < 16.3) o.ry = t < 15.85 ? lerp(o.ry, 90, f1) : lerp(-90, 12, f2);
      if (t >= 16.3) o.ry = 12 - prog(t, 16.3, 19.7) * 26;
      // pull back into carousel
      const pb = eIn(prog(t, 19.7, 20.4));
      o.z = lerp(0, -900, pb); o.s *= 1; o.y += pb * -60;
      $('#rig').style.transform = rigTransform(o);
      $('#rig').querySelector('.phone').style.filter = t > 11.7 && t < 12.8 ? `blur(${bump(t, 12.15, 0.12) * 10}px)` : 'none';
      $('#glare').style.backgroundPosition = `${lerp(100, -20, (o.ry + 90) / 180) * 1}% 0`;

      // screen layers
      const feedOn = t < 12.15, storyOn = t >= 12.15 && t < 15.85, chatOn = t >= 15.85;
      show($('#Lfeed'), feedOn ? 1 : 0); show($('#feedNav'), feedOn ? 1 : 0);
      show($('#Lstory'), storyOn ? 1 : 0); show($('#Lchat'), chatOn ? 1 : 0);
      // feed scroll like a thumb: flick, hold, flick
      const sc = 380 * eIO(prog(t, 6.9, 7.6)) + 520 * eIO(prog(t, 8.6, 9.3)) + 560 * eIO(prog(t, 10.2, 10.9)) - 1460 * eIO(prog(t, 11.0, 11.55));
      $('#feedImg').style.transform = `translateY(${-sc}px)`;
      // story mascot bursts out of the screen
      const bo = prog(t, 13.35, 13.8) - eIO(prog(t, 15.0, 15.45));
      const boV = t >= 13.35 && t < 15.45 ? 1 : 0;
      show($('#storyPop'), boV);
      show($('#breakout'), boV);
      if (boV > 0) {
        const s = lerp(1, 1.55, t < 15 ? back(bo, 2.5) : bo);
        $('#breakout').style.transform = `translate3d(${14 + Math.sin(t * 3) * 6}px, ${241 - bo * 150 + Math.sin(t * 2.2) * 10}px, ${bo * 260}px) scale(${s}) rotate(${Math.sin(t * 4) * 4}deg)`;
        $('#breakout').style.filter = `drop-shadow(0 30px 40px rgba(0,0,0,.45)) drop-shadow(0 0 ${30 + 20 * Math.sin(t * 8)}px rgba(192,132,252,.8))`;
      }
      // chat bubbles land on the beat
      const steps = [[16.5, 212], [17.0, 312], [17.5, 412], [18.25, 512], [19.0, 706]];
      let top = 140;
      for (const [ts, y] of steps) { const p = back(prog(t, ts, ts + 0.3), 1.2); if (t >= ts) top = lerp(top, y, p); }
      css($('#chatMask'), { top: top + 'px', height: Math.max(0, 706 - top) + 'px' });

      chip($('#c1'), t, 7.0, 11.8, -90, 330, 180);
      chip($('#c2'), t, 7.6, 11.8, 150, 150, 260);
      chip($('#c3'), t, 8.8, 11.8, 230, 560, 200);
      chip($('#c4'), t, 9.9, 11.8, 110, 740, 280);
      chip($('#e1'), t, 17.5, 20.0, 310, 300, 240);
      chip($('#e2'), t, 18.25, 20.0, -50, 430, 300);
      chip($('#e3'), t, 19.0, 20.0, 300, 540, 260);
    }
    caption($('#capFeed'), t, 6.3, 11.8);
    caption($('#capStory'), t, 12.4, 15.6);
    caption($('#capChat'), t, 16.2, 19.8);

    // mascot peeks
    const pk1 = vis(t, 8.5, 11.8, .01, .3), pk1p = back(prog(t, 8.5, 9.0), 2);
    show($('#peekThumb'), pk1);
    css($('#peekThumb'), { left: '-40px', top: `${lerp(1950, 1440, pk1p) + prog(t, 11.5, 11.8) * 500}px`, transform: `rotate(${lerp(30, 12, pk1p) + Math.sin(t * 4) * 3}deg)` });
    const pk2 = vis(t, 17.2, 19.8, .01, .3), pk2p = back(prog(t, 17.2, 17.7), 2);
    show($('#peekChat'), pk2);
    css($('#peekChat'), { left: `${lerp(1100, 700, pk2p)}px`, top: '1380px', transform: `rotate(${lerp(-30, -10, pk2p) + Math.sin(t * 4) * 3}deg)` });

    // ===== F. Games carousel 20–24 =====
    const carV = vis(t, 19.9, 24.2, .3, .35);
    show($('#carousel'), carV);
    if (carV > 0) {
      const inp = eOut(prog(t, 19.9, 20.8));
      const spin = eIO(prog(t, 21.4, 21.9)) + eIO(prog(t, 22.8, 23.3)) + eIn(prog(t, 23.7, 24.2)) * 1.5;
      const exitZ = eIn(prog(t, 23.7, 24.2));
      $('#carousel').style.transform = `translate3d(0, 220px, ${lerp(-2500, -560, inp) - exitZ * 800}px) rotateX(-4deg) rotateY(${lerp(-200, 0, inp) - spin * 120}deg)`;
      $$('#carousel .rig').forEach(el => {
        const i = +el.dataset.i;
        el.style.transform = `rotateY(${i * 120}deg) translateZ(560px) scale(1.3)`;
      });
    }
    caption($('#capGames'), t, 20.3, 23.9);
    const pk3 = vis(t, 20.8, 24.0, .01, .3), pk3p = back(prog(t, 20.8, 21.3), 2);
    show($('#peekGame'), pk3);
    css($('#peekGame'), { left: '305px', top: `${lerp(2000, 1540, pk3p) + prog(t, 23.7, 24) * 600}px`, transform: `scale(${1 + pulse * 0.04})` });

    // ===== G. Safety 24–27 =====
    const sv = vis(t, 23.95, 27.05, .3, .1);
    show($('#safe'), sv);
    if (sv > 0) {
      const inp = back(prog(t, 24.0, 24.6), 1.6);
      const zoom = eIn(prog(t, 26.3, 27.0));
      $('#safe').style.transform = `scale(${1 + zoom * 2.5})`;
      $('#safe').style.transformOrigin = '540px 820px';
      $('#safe').style.filter = `blur(${zoom * 14}px)`;
      $('#safeMascot').style.transform = `scale(${lerp(.4, 1, inp)}) translateY(${Math.sin(t * 2.5) * 14}px)`;
      $$('#pulse div').forEach((d, i) => {
        const ph = ((t - 24 + i * 0.6) % 1.8) / 1.8;
        const r = 200 + ph * 700;
        css(d, { width: r * 2 + 'px', height: r * 2 + 'px', left: -r + 'px', top: -r + 'px', opacity: (1 - ph) * .7 * clamp((t - 24) * 3) });
      });
      ['#g1', '#g2', '#g3'].forEach((id, i) => {
        const p = prog(t, 24.6 + i * 0.35, 25.1 + i * 0.35);
        css($(id), { opacity: clamp(p * 2), transform: `translateX(${(1 - eOut(p)) * (i % 2 ? 900 : -900)}px) rotate(${(1 - eOut(p)) * (i % 2 ? 8 : -8)}deg)` });
      });
    }
    caption($('#capSafe'), t, 24.1, 26.7);

    // ===== H. End 27–30 =====
    const ev = prog(t, 26.95, 27.05);
    show($('#end'), ev);
    if (ev > 0) {
      const lp = prog(t, 27.0, 27.7);
      $('#rays').style.transform = `rotate(${t * 18}deg) scale(${lerp(.3, 1, eOut(lp))})`;
      $('#logoWrap').style.transform = `scale(${lerp(.2, 1, back(lp, 2))}) rotate(${(1 - eOut(lp)) * -90}deg)`;
      $('#logoRing').style.transform = `rotate(${t * 200}deg)`;
      $$('#endName span').forEach((s, i) => {
        const p = prog(t, 27.4 + i * 0.045, 27.85 + i * 0.045);
        s.style.transform = `translateY(${(1 - back(p, 2.4)) * -260}px) rotate(${(1 - eOut(p)) * (i % 2 ? 20 : -20)}deg)`;
        s.style.opacity = clamp(p * 3);
      });
      const tg = eOut(prog(t, 27.95, 28.35));
      css($('#endTag'), { opacity: tg, transform: `translateY(${(1 - tg) * 40}px)` });
      const cp = prog(t, 28.3, 28.75);
      css($('#cta'), { opacity: clamp(cp * 3), transform: `scale(${lerp(.4, 1, back(cp, 2.2)) * (1 + (t > 28.75 ? 0.05 * Math.max(0, Math.sin((t - 28.75) * 2 * Math.PI * 2)) : 0))})` });
    }

    drawFx(t);
    drawGrain(frame);

    // flashes on the big cuts
    $('#flash').style.opacity = 0.9 * bump(t, 3.97, 0.07) + 0.35 * bump(t, 12.15, 0.06) + 0.25 * bump(t, 20.0, 0.08) + 1.0 * bump(t, 27.0, 0.09);
  };

  if (!location.search.includes('render')) {
    const start = performance.now();
    (function loop() { render(((performance.now() - start) / 1000) % 30); requestAnimationFrame(loop); })();
  }
</script>
</body>
</html>
